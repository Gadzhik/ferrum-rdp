[workspace]
resolver = "3"
members = ["crates/freerdp-sys", "crates/rdp-core", "crates/ferrum-profiles", "crates/ferrum"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
